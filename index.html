<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Camill · Sistema operativo</title>
<link rel="manifest" href="manifest.json">

<body>
<!-- Iconos: una sola familia lineal (trazo 1.8, extremos redondeados) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16.5 14.5h.01"/></symbol>
  <symbol id="i-checks" viewBox="0 0 24 24"><path d="m3.5 7 2 2 4-4"/><path d="m3.5 15 2 2 4-4"/><path d="M13 7h7.5M13 15h7.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>

  <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01"/></symbol>

<div class="fondo" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i>
  <svg viewBox="0 0 520 260"><path d="M0 200 C120 60 260 260 520 70" stroke="#4B7286" stroke-width="46" fill="none" stroke-linecap="round"/></svg>
</div>

<div id="app">
  <header class="barra-sup" id="barra" hidden>
    <img src="logo.png" alt="Camill Droguería">
    <div class="t"><b id="barra-tit">Camill</b><span id="barra-sub"></span></div>
    <button class="avatar" id="avatar" title="Mi cuenta y más secciones"></button>
  </header>
  <main class="pantalla" id="pantalla">
    <div class="cargando">Cargando…</div>
  </main>
  <nav class="nav" id="nav" hidden>
    <a href="#inicio" data-v="inicio"><svg class="i"><use href="#i-home"/></svg>Inicio</a>
    <a href="#domicilios" data-v="domicilios"><svg class="i"><use href="#i-truck"/></svg>Domicilios</a>
    <button class="mas" id="registrar" type="button" aria-label="Registrar"><svg class="i"><use href="#i-plus"/></svg><span>Registrar</span></button>
    <a href="#caja" data-v="caja"><svg class="i"><use href="#i-wallet"/></svg>Caja</a>
    <a href="#turno" data-v="turno"><svg class="i"><use href="#i-checks"/></svg>Mi turno</a>
    <a href="#mas" data-v="mas" class="solo-desk"><svg class="i"><use href="#i-grid"/></svg>Más secciones</a>
  </nav>
</div>
<div class="velo" id="velo" hidden><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>
<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
